name: Build and Push Docker Image to Docker Hub

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # 每天 03:00 定时构建一次（上游同步 02:00 之后）
  push:
    branches: [hermes-only]
    paths-ignore:
      - "README.md"
      - "README_zh.md"
      - "LICENSE"
      - "AGENTS.md"
      - ".github/**"

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: hermes-only
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image (hermes-only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ekko-studio:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ekko-studio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max