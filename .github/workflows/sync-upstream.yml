name: Sync upstream (ekko-studio)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: hermes-only
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name "lzylipu-bot"
          git config user.email "lzylipu-bot@users.noreply.github.com"
          git config pull.rebase false

      - name: Snapshot local customizations
        run: |
          git remote add upstream https://github.com/EKKOLearnAI/ekko-studio.git || true
          git fetch upstream main
          git diff --name-only $(git merge-base upstream/main HEAD)..HEAD > /tmp/custom_files.txt
          mkdir -p /tmp/hermes-custom
          while IFS= read -r f; do
            if [ -f "$f" ]; then
              mkdir -p "/tmp/hermes-custom/$(dirname "$f")"
              cp "$f" "/tmp/hermes-custom/$f"
            fi
          done < /tmp/custom_files.txt

      - name: Merge upstream
        run: |
          # Upstream wins while merging overlapping changes. The next step
          # restores every fork-customized file from the saved snapshot.
          git merge --no-edit -X theirs upstream/main

      - name: Restore local customizations
        run: |
          while IFS= read -r f; do
            if [ -f "/tmp/hermes-custom/$f" ]; then
              mkdir -p "$(dirname "$f")"
              cp "/tmp/hermes-custom/$f" "$f"
            fi
          done < /tmp/custom_files.txt
          git add -A
          git diff --cached --quiet || git commit -m "sync: merge upstream into hermes-only, keep local customizations"

      - name: Push merged commits
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/lzylipu/ekko-studio.git"
          git push origin HEAD:hermes-only
