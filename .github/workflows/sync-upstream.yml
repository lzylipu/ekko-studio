name: Sync upstream (ekko-studio)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches: [custom]

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: hermes-only
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name "lzylipu-bot"
          git config user.email "lzylipu-bot@users.noreply.github.com"
          git config pull.rebase false

      - name: Check upstream updates
        id: upstream
        run: |
          git remote add upstream https://github.com/EKKOLearnAI/ekko-studio.git || true
          git fetch upstream main
          git fetch origin main custom hermes-only

          if [ "$(git rev-parse origin/main)" = "$(git rev-parse upstream/main)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游没有新提交。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到上游新提交。"
          fi

      - name: Update main from upstream
        if: steps.upstream.outputs.changed == 'true'
        run: |
          git switch --force-create main upstream/main

      - name: Push updated main
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main --force-with-lease

      - name: Build integration branch
        id: integration
        run: |
          git switch --detach origin/custom
          git merge --no-edit -X ours upstream/main

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "存在无法自动处理的真实冲突："
            printf '%s\n' "$unresolved"
            exit 1
          fi

          if [ "$(git rev-parse HEAD^{tree})" = "$(git rev-parse origin/hermes-only^{tree})" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "自定义分支和上游均未产生新的最终内容，跳过镜像构建。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "最终内容有更新，将更新 hermes-only 并触发一次镜像构建。"
          fi

      - name: Push integration branch
        if: steps.integration.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:hermes-only --force-with-lease
